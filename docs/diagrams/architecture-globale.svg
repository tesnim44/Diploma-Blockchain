<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Architecture globale de DiplomaChain</title><desc id="desc">L'université utilise l'interface Admin et MetaMask pour émettre des diplômes sur Sepolia. Les métadonnées vont vers Express et MongoDB. Le recruteur utilise l'interface publique qui calcule le hash et lit le contrat sans signature.</desc>
<defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#2563eb"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#15803d"/></marker><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#0f766e"/></marker><style>
.bg{fill:#f8fafc}.t{font:700 30px Arial;fill:#102a43}.s{font:17px Arial;fill:#526579}.h{font:700 21px Arial;fill:#17324d;text-anchor:middle}.p{font:16px Arial;fill:#526579;text-anchor:middle}.box{fill:#fff;stroke:#9bb4cc;stroke-width:2;rx:16}.admin{fill:#eaf2ff;stroke:#2563eb}.chain{fill:#fff7df;stroke:#d49a2a;stroke-width:2}.pub{fill:#e8f7ef;stroke:#15803d}.db{fill:#e7f7f5;stroke:#0f766e}.arrb{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#blue)}.arrg{fill:none;stroke:#15803d;stroke-width:3;marker-end:url(#green)}.arrt{fill:none;stroke:#0f766e;stroke-width:3;marker-end:url(#teal)}.lbl{font:16px Arial;fill:#334155}
</style></defs>
<rect class="bg" width="1400" height="900" rx="24"/>
<text class="t" x="700" y="58" text-anchor="middle">Architecture du système de certification de diplômes</text>
<rect class="box" x="70" y="115" width="300" height="85"/><text class="h" x="220" y="150">Université (Admin)</text><text class="p" x="220" y="177">Fournit les informations et le PDF</text>
<rect class="box admin" x="70" y="270" width="300" height="145"/><text class="h" x="220" y="308">Interface Admin</text><text class="p" x="220" y="338">Formulaire et calcul SHA-256</text><text class="p" x="220" y="365">Émission / demande de révocation</text><text class="p" x="220" y="392">Ethers.js</text>
<path class="arrb" d="M220 200 V270"/><text class="lbl" x="238" y="240">PDF + infos</text>
<rect class="box" x="70" y="515" width="300" height="115"/><text class="h" x="220" y="553">MetaMask</text><text class="p" x="220" y="582">Signature des transactions</text><text class="p" x="220" y="607">Compte propriétaire — gas Sepolia</text>
<path class="arrb" d="M220 415 V515"/><text class="lbl" x="238" y="475">Transaction</text>
<rect class="box db" x="70" y="700" width="300" height="115"/><text class="h" x="220" y="738">Backend Express + MongoDB</text><text class="p" x="220" y="767">API REST et métadonnées</text><text class="p" x="220" y="792">Hors blockchain</text>
<path class="arrt" d="M70 350 H35 V755 H70"/><text class="lbl" x="25" y="555" transform="rotate(-90 25 555)">Sauvegarde des infos</text>
<rect x="480" y="145" width="440" height="590" rx="22" fill="#f4efff" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="10 7"/>
<text class="h" x="700" y="185">Ethereum Sepolia (réseau de test)</text>
<rect class="box chain" x="535" y="230" width="330" height="435"/><text class="h" x="700" y="275">Smart Contract Diplomes.sol</text><text class="p" x="700" y="325">emettreDiplome(hash, nom)</text><text class="p" x="700" y="352">Réservé à l'owner (onlyOwner)</text><path d="M565 380 H835" stroke="#d49a2a" stroke-width="1.5"/><text class="p" x="700" y="425">verifierDiplome(hash)</text><text class="p" x="700" y="452">Lecture publique (view)</text><path d="M565 480 H835" stroke="#d49a2a" stroke-width="1.5"/><text class="p" x="700" y="525">revoquerDiplome(hash)</text><text class="p" x="700" y="552">Réservé à l'owner (onlyOwner)</text><path d="M565 580 H835" stroke="#d49a2a" stroke-width="1.5"/><text class="p" x="700" y="620">Mapping : hash, nom, date,</text><text class="p" x="700" y="645">valide, existe</text>
<path class="arrb" d="M370 570 H480"/><text class="lbl" x="395" y="550">Appel signé</text>
<path class="arrb" d="M535 300 H425 V340 H370" stroke-dasharray="8 6"/><text class="lbl" x="410" y="320">Confirmation</text>
<rect class="box" x="1030" y="115" width="300" height="85"/><text class="h" x="1180" y="150">Recruteur (public)</text><text class="p" x="1180" y="177">Soumet le PDF à vérifier</text>
<rect class="box pub" x="1030" y="270" width="300" height="145"/><text class="h" x="1180" y="308">Interface publique</text><text class="p" x="1180" y="338">Calcul SHA-256 du PDF</text><text class="p" x="1180" y="365">Lecture du statut sur Sepolia</text><text class="p" x="1180" y="392">Sans MetaMask ni signature</text>
<path class="arrg" d="M1180 200 V270"/><text class="lbl" x="1198" y="240">PDF</text>
<path class="arrg" d="M1030 340 H920"/><text class="lbl" x="935" y="320">verifierDiplome(hash)</text>
<path class="arrg" d="M920 400 H1030"/><text class="lbl" x="940" y="425">existe + valide</text>
<rect class="box" x="970" y="515" width="360" height="115"/><text class="h" x="1150" y="553">Résultat affiché</text><text class="p" x="1150" y="582">AUTHENTIQUE · RÉVOQUÉ · INTROUVABLE</text><text class="p" x="1150" y="607">Erreur RPC : « Vérification impossible »</text>
<path class="arrg" d="M1180 415 V515"/>
<rect class="box" x="455" y="785" width="490" height="70"/><text class="p" x="700" y="815">La blockchain décide de l'existence et du statut ; MongoDB gère les métadonnées.</text><text class="p" x="700" y="840">Le PDF complet n'est pas stocké sur la blockchain.</text>
</svg>