<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Parcours de vérification d'un diplôme</title>
<desc id="desc">Le PDF est haché en SHA-256, puis le contrat renvoie trois états : authentique, révoqué ou introuvable.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#64748b"/></marker><style>
.bg{fill:#f8fafc}.title{font:700 34px Arial;fill:#102a43}.sub{font:18px Arial;fill:#526579}.node{fill:#fff;stroke:#9bb4cc;stroke-width:2;rx:15}.blue{fill:#eaf2ff;stroke:#3675c5}.green{fill:#e8f7ef;stroke:#26945d}.red{fill:#fff0ed;stroke:#d65b50}.gray{fill:#f1f3f6;stroke:#8793a3}.txt{font:700 20px Arial;fill:#17324d;text-anchor:middle}.small{font:16px Arial;fill:#526579;text-anchor:middle}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arr)}.tag{font:16px Arial;fill:#526579}
</style></defs>
<rect class="bg" width="1200" height="920" rx="24"/>
<text class="title" x="60" y="70">3.2 — Parcours de vérification</text><text class="sub" x="60" y="108">Le résultat public reflète l'existence et le statut enregistrés sur Sepolia</text>
<rect class="node" x="390" y="145" width="420" height="72"/><text class="txt" x="600" y="175">Recruteur / vérificateur</text><text class="small" x="600" y="199">Sélectionne le PDF reçu</text>
<path class="line" d="M600 217 V250"/>
<rect class="node blue" x="390" y="250" width="420" height="72"/><text class="txt" x="600" y="280">Interface publique</text><text class="small" x="600" y="304">Le fichier reste dans le navigateur</text>
<path class="line" d="M600 322 V355"/>
<rect class="node blue" x="390" y="355" width="420" height="72"/><text class="txt" x="600" y="385">Calcul SHA-256</text><text class="small" x="600" y="409">Même calcul que lors de l'émission</text>
<path class="line" d="M600 427 V460"/>
<rect class="node green" x="390" y="460" width="420" height="72"/><text class="txt" x="600" y="490">Smart Contract — Sepolia</text><text class="small" x="600" y="514">verifierDiplome(hash) — lecture sans signature</text>
<path class="line" d="M600 532 V575"/>
<polygon points="600,575 770,640 600,705 430,640" fill="#fff" stroke="#9bb4cc" stroke-width="2"/><text class="txt" x="600" y="635">existe ?</text><text class="small" x="600" y="660">Le hash est-il enregistré ?</text>
<path class="line" d="M430 640 H210 V760"/><text class="tag" x="285" y="620">Non</text>
<rect class="node gray" x="75" y="760" width="270" height="78"/><text class="txt" x="210" y="792">INTROUVABLE</text><text class="small" x="210" y="817">existe = false</text>
<path class="line" d="M770 640 H990 V720"/><text class="tag" x="860" y="620">Oui</text>
<polygon points="990,720 1135,775 990,830 845,775" fill="#fff" stroke="#9bb4cc" stroke-width="2"/><text class="txt" x="990" y="770">valide ?</text><text class="small" x="990" y="795">Statut enregistré</text>
<path class="line" d="M845 775 H650 V855"/><text class="tag" x="715" y="755">Non</text>
<rect class="node red" x="520" y="855" width="260" height="55"/><text class="txt" x="650" y="889">RÉVOQUÉ</text>
<path class="line" d="M1135 775 H1150 V855"/><text class="tag" x="1110" y="755">Oui</text>
<rect class="node green" x="900" y="855" width="250" height="55"/><text class="txt" x="1025" y="889">AUTHENTIQUE</text>
</svg>