<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Parcours de vérification d'un diplôme</title>
<desc id="desc">Le vérificateur sélectionne le PDF, le navigateur calcule son empreinte SHA-256 puis interroge le Smart Contract. Le diplôme est déclaré authentique si son empreinte existe dans le registre, sinon il est introuvable.</desc>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#64748b"/></marker>
<style>
.bg{fill:#f8fafc}.title{font:700 34px Arial;fill:#102a43}.sub{font:18px Arial;fill:#526579}
.node{fill:#fff;stroke:#9bb4cc;stroke-width:2;rx:15}.blue{fill:#eaf2ff;stroke:#3675c5}.green{fill:#e8f7ef;stroke:#26945d}.gray{fill:#f1f3f6;stroke:#8793a3}
.txt{font:700 20px Arial;fill:#17324d;text-anchor:middle}.small{font:16px Arial;fill:#526579;text-anchor:middle}
.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arr)}.tag{font:16px Arial;fill:#526579}
</style></defs>
<rect class="bg" width="1200" height="820" rx="24"/>
<text class="title" x="60" y="70">3.2 — Parcours de vérification</text>
<text class="sub" x="60" y="108">La vérification publique consulte directement le registre blockchain</text>
<rect class="node" x="390" y="145" width="420" height="72"/>
<text class="txt" x="600" y="175">Vérificateur</text><text class="small" x="600" y="199">Sélectionne le PDF original</text>
<path class="line" d="M600 217 V250"/>
<rect class="node blue" x="390" y="250" width="420" height="72"/>
<text class="txt" x="600" y="280">Interface publique</text><text class="small" x="600" y="304">Le fichier reste dans le navigateur</text>
<path class="line" d="M600 322 V355"/>
<rect class="node blue" x="390" y="355" width="420" height="72"/>
<text class="txt" x="600" y="385">Calcul SHA-256</text><text class="small" x="600" y="409">Même algorithme que lors de l'émission</text>
<path class="line" d="M600 427 V460"/>
<rect class="node green" x="390" y="460" width="420" height="72"/>
<text class="txt" x="600" y="490">Smart Contract — Sepolia</text><text class="small" x="600" y="514">Lecture verifierDiplome(hash), sans transaction</text>
<path class="line" d="M600 532 V570"/>
<polygon points="600,570 760,635 600,700 440,635" fill="#fff" stroke="#9bb4cc" stroke-width="2"/>
<text class="txt" x="600" y="630">Hash enregistré ?</text><text class="small" x="600" y="655">Résultat de la lecture</text>
<path class="line" d="M440 635 H230 V735"/><text class="tag" x="290" y="615">Non</text>
<rect class="node gray" x="100" y="735" width="260" height="65"/>
<text class="txt" x="230" y="763">INTROUVABLE</text><text class="small" x="230" y="785">Hash absent du registre</text>
<path class="line" d="M760 635 H970 V735"/><text class="tag" x="850" y="615">Oui</text>
<rect class="node green" x="840" y="735" width="260" height="65"/>
<text class="txt" x="970" y="763">AUTHENTIQUE</text><text class="small" x="970" y="785">Empreinte enregistrée</text>
</svg>